name: "Continuous Integration"

run-name: "Continuous Integration • ${{ github.ref_name }} @${{ github.actor }}"

concurrency:
    group: "ci-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

on:
    push:
        branches:
            - "main"
    pull_request:
    merge_group:
        types:
            - "checks_requested"

jobs:
    test:
        name: "Test (${{ matrix.label }})"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 60
        permissions:
            contents: "read"
            id-token: "write"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - label: "linux"
                      os: "ubuntu-latest"
                      codecov_flag: "os-linux"
                    - label: "windows"
                      os: "windows-latest"
                      codecov_flag: "os-windows"
                    - label: "macos"
                      os: "macos-latest"
                      codecov_flag: "os-macos"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              if: "${{ matrix.os == 'ubuntu-latest' }}"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node.js"
              uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
              with:
                  node-version-file: ".node-version"
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"

            - name: "Install dependencies"
              run: "npm ci --force"

            - name: "Build package"
              run: "npm run build"

            - name: "Typecheck"
              run: "npm run typecheck"

            - name: "Run tests with JUnit report"
              run: "npx vitest run --reporter=github-actions --reporter=dot --reporter=junit --outputFile=test-report.junit.xml --silent"
              env:
                  CI: "true"
                  MAX_THREADS: "1"
                  VITEST_HANGING_PROCESS_REPORTER: "true"

            - name: "Run runtime coverage"
              run: "npm run coverage"

            - name: "Verify coverage artifact"
              run: >-
                  python -c "from pathlib import Path; report = Path('coverage/lcov.info'); assert report.is_file() and report.stat().st_size > 0, 'coverage/lcov.info was not generated or is empty'"

            - name: "Verify JUnit artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('test-report.junit.xml').is_file(), 'test-report.junit.xml was not generated'"

            - name: "Upload test results to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
              with:
                  use_oidc: true
                  slug: "Nick2bad4u/secretlint-config-nick2bad4u"
                  files: "test-report.junit.xml"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-junit-${{ matrix.codecov_flag }}"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
              with:
                  use_oidc: true
                  slug: "Nick2bad4u/secretlint-config-nick2bad4u"
                  files: "./coverage/lcov.info"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-unit-coverage-${{ matrix.codecov_flag }}"
                  report_type: "coverage"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

    verify:
        name: "Verify pipeline"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        permissions:
            contents: "read"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node.js"
              uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
              with:
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"
                  node-version-file: ".node-version"

            - name: "Install native lint tools"
              run: |
                  set -euo pipefail
                  go install github.com/zricethezav/gitleaks/v8@v8.30.1
                  echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
                  python -m pip install --user --disable-pip-version-check yamllint==1.38.0
                  echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

            - name: "Install dependencies"
              run: "npm ci --force"

            - name: "Run full verification pipeline"
              run: "npm run release:verify"
